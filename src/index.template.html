<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>yeN · 学习工作台</title>
    <style>
      /*__STYLE__*/
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <a class="brand" href="#today"
          ><span class="brand-mark">y</span
          ><span>yeN<small>学习工作台</small></span></a
        >
        <nav aria-label="主导航"></nav>
        <div class="side-bottom">
          <div class="local-label">
            <span></span> 本地空间
            <small id="sidebar-version">读取版本中</small>
          </div>
          <button
            class="nav-item"
            data-page="settings"
            id="settings-nav"
          ></button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            我的空间 <span>/</span> <strong id="page-name">今日</strong>
          </div>
          <div class="top-actions">
            <span id="save-state" role="status">正在打开</span
            ><button
              class="icon-button"
              data-action="search"
              aria-label="搜索笔记"
            ></button
            ><button class="button primary" data-action="quick">＋ 新建</button
            ><span class="avatar">我</span>
          </div>
        </header>
        <main id="main"></main>
        <footer>
          <span id="footer-version">yeN · 桌面版</span
          ><span>Ctrl + K 搜索笔记</span>
        </footer>
      </div>
    </div>
    <dialog id="modal"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="file-picker" type="file" multiple hidden /><input
      id="import-picker"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <script>
      /*__SCRIPT__*/
    </script>
  </body>
</html>
